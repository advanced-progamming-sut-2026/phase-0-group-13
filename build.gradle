plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    // همان مِیوِن‌سنترال با آدرس اصلی خودش، فقط برای گروه‌های JUnit. گریدل کش را به‌ازای
    // هر مخزن نگه می‌دارد، پس این باعث می‌شود ماشینی که این آرتیفکت‌ها را قبلا از این آدرس
    // گرفته، آفلاین هم پیدایشان کند. content{} لازم است تا بقیه وابستگی‌ها سراغ اینجا نروند.
    maven {
        url 'https://repo1.maven.org/maven2/'
        content {
            includeGroupByRegex "org\\.junit.*"
            includeGroup 'org.opentest4j'
            includeGroup 'org.apiguardian'
            includeGroup 'org.jspecify'
        }
    }
    // pvz-skin و TenPatch فقط از جیت‌پک منتشر شده‌اند
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.7'
    implementation 'ch.qos.logback:logback-classic:1.4.7'
    implementation 'com.esotericsoftware:kryonet:2.22.0-RC1'
    implementation 'com.google.code.gson:gson:2.10.1'
    // نسخه‌ها از BOM می‌آیند تا api/engine/launcher هم‌نسخه بمانند.
    // launcher را گریدل ۹ خودش اضافه نمی‌کند و بدون آن تسک test اصلا بالا نمی‌آید.
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.esotericsoftware:kryonet:2.22.0-RC1'
    implementation 'com.badlogicgames.gdx:gdx:1.12.1'
    implementation 'com.badlogicgames.gdx:gdx-platform:1.12.1:natives-desktop'
    implementation 'com.badlogicgames.gdx:gdx-backend-lwjgl3:1.12.1'
    // فایل اسکین resources/skin به این دو نیاز دارد: فونت‌هایش FreeType هستند
    // و پس‌زمینهٔ دکمه‌ها TenPatch. بدون این‌ها اسکین اصلا پارس نمی‌شود.
    implementation 'com.badlogicgames.gdx:gdx-freetype:1.12.1'
    implementation 'com.github.raeleus.TenPatch:tenpatch:5.2.3'
    runtimeOnly 'com.badlogicgames.gdx:gdx-freetype-platform:1.12.1:natives-desktop'
}

// سورس‌ها UTF-8 هستند (کامنت‌های فارسی)؛ بدون این، javac با کدپیج پیش‌فرض ویندوز
// (windows-1252) روی همان کامنت‌ها با unmappable character شکست می‌خورد
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        // تصاویر/فونت‌ها/... مربوط به نسخه گرافیکی؛ روی کلاس‌پث می‌رود تا Gdx.files.internal پیدایشان کند
        resources {
            srcDir 'assets'
        }
    }
    // تست‌ها بیرون از src/ هستند چون srcDir اصلی خودِ src است؛
    // اگر داخلش بودند، کامپایل main هم سعی می‌کرد آن‌ها را بسازد و JUnit روی کلاسپثش نیست.
    test {
        java {
            srcDirs = ['test']
        }
    }
}

// اسکین Scene2D تنها چیزی است که از resources/ روی کلاس‌پث می‌رود.
// خود resources/ حدود ۸۴۰ مگابایت است و نباید کلاسپث شود، برای همین فقط همین پوشه کپی می‌شود
// و کپی دومی از آن داخل assets/ نگه نمی‌داریم تا دو فایل روی یک مسیر نیفتد.
tasks.named('processResources') {
    from('resources/skin') {
        into 'skin'
    }
    // قالب‌های فقط-خواندنیِ بازی، تا جارِ بسته‌بندی‌شده بدون درختِ پروژه هم پیدایشان کند.
    // ذخیره‌ها و حساب‌ها اینجا نمی‌آیند: شخصی‌اند و نباید همراه جار سفر کنند.
    from('src/data/database') {
        include 'plants.json', 'Zombies.json', 'Quests.json'
        into 'database'
    }
}

// نسخه گرافیکی (LibGDX). نسخه ترمینالی دست‌نخورده با همان Main قبلی اجرا می‌شود.
tasks.register('runGdx', JavaExec) {
    group = 'application'
    description = 'Runs the LibGDX desktop launcher. Add -Ppvz.debug=true for the debug controls.'
    mainClass = 'view.gdx.DesktopLauncher'
    classpath = sourceSets.main.runtimeClasspath
    // حالت دیباگ: ./gradlew runGdx -Ppvz.debug=true
    systemProperty 'pvz.debug', String.valueOf(project.findProperty('pvz.debug') ?: false)
    // روی مک، بک‌اند LWJGL3 باید روی ترد اول اجرا شود
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}

// دو جارِ قابل‌اجرا: یکی خودِ بازی و یکی سرور فاز ۳.
// دقت: rig‌های PAM (resources/raw) و دیتابیس JSON از کنارِ working directory خوانده می‌شوند،
// نه از کلاس‌پث، پس هر دو جار باید از ریشهٔ پروژه اجرا شوند.
// امضای جارهای اصلی بعد از ادغام بی‌اعتبار می‌شود و JVM جار را رد می‌کند، پس حذفشان می‌کنیم.
def mergedJarNoise = ['META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class']

// کتابخانه‌های گرافیکی. سرور هیچ‌کدامشان را لازم ندارد: در model/ data/ network/ حتی یک
// import از com.badlogic هم نیست، پس از جارِ سرور بیرون می‌مانند.
def graphicsLibs = ['gdx', 'lwjgl', 'tenpatch', 'jlayer', 'jorbis']

// rig‌هایی که واقعا استفاده می‌شوند. resources/raw حدود ۵۱۱ مگابایت است ولی مانیفست‌ها فقط ۱۰۶
// فایل PAM (~۲۳ مگابایت) را صدا می‌زنند و PNG‌هایش اصلا خوانده نمی‌شود، چون هنر بازی از اطلس‌های
// داخل assets/ می‌آید. با خواندن خودِ مانیفست‌ها، این لیست همیشه با آن‌ها هم‌گام می‌ماند.
def referencedPams = {
    def refs = [] as Set
    fileTree('assets/animations').matching { include '**/*.json' }.each { manifest ->
        new groovy.json.JsonSlurper().parse(manifest).animations.each { entry ->
            if (entry.pam) {
                refs << entry.pam
            }
        }
    }
    refs.toList()
}

// خودِ بازی. روی مک به -XstartOnFirstThread هم نیاز دارد.
tasks.register('gameJar', Jar) {
    group = 'build'
    description = 'Builds the runnable game jar. Run it from the project root.'
    archiveBaseName = 'pvz-game'
    archiveVersion = ''
    manifest {
        attributes 'Main-Class': 'view.gdx.DesktopLauncher'
        // LWJGL بارگذاری کتابخانه‌های نیتیو را با JDK 24 به بعد اعلام می‌کند، وگرنه هر بار
        // چند خط WARNING چاپ می‌شود. JDKهای قدیمی‌تر این خط را بی‌ضرر نادیده می‌گیرند.
        attributes 'Enable-Native-Access': 'ALL-UNNAMED'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from('resources/raw/pvz2/IMAGES') {
        into 'resources/raw/pvz2/IMAGES'
        include referencedPams()
    }
    from {
        configurations.runtimeClasspath.filter { it.name.endsWith('.jar') }.collect { zipTree(it) }
    }
    exclude mergedJarNoise
}

// سرور. نه کلاس‌های گرافیکی می‌گیرد نه assets، چون هیچ‌کدام را باز نمی‌کند.
tasks.register('serverJar', Jar) {
    group = 'build'
    description = 'Builds the runnable server jar. Run it from the project root.'
    archiveBaseName = 'pvz-server'
    archiveVersion = ''
    manifest {
        attributes 'Main-Class': 'network.server.ServerApplication'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.main.output.classesDirs) {
        exclude 'view/gdx/**'
    }
    from(sourceSets.main.output) {
        include 'database/**'
    }
    from {
        configurations.runtimeClasspath
                .filter { file -> file.name.endsWith('.jar')
                        && graphicsLibs.every { !file.name.startsWith(it) } }
                .collect { zipTree(it) }
    }
    exclude mergedJarNoise
}

tasks.register('jars') {
    group = 'build'
    description = 'Builds both runnable jars.'
    dependsOn 'gameJar', 'serverJar'
}

// نسخه ترمینالی فاز ۱
tasks.register('runTerminal', JavaExec) {
    group = 'application'
    description = 'Runs the Phase 1 terminal version.'
    mainClass = 'Main'
    classpath = sourceSets.main.runtimeClasspath
}

// سرور فاز ۳. پورت پیش‌فرض ۷۰۷۰ است: ./gradlew runServer -Pport=7070
tasks.register('runServer', JavaExec) {
    group = 'application'
    description = 'Runs the Phase 3 game server.'
    mainClass = 'network.server.ServerApplication'
    classpath = sourceSets.main.runtimeClasspath
    if (project.hasProperty('port')) {
        args project.property('port')
    }
}

// اجازه می‌دهد ورودی کیبورد به برنامه برسد وقتی از طریق Gradle اجرا می‌شود
tasks.withType(JavaExec).configureEach {
    standardInput = System.in
}
